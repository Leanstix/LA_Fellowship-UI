name: Build frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build standalone site
        run: npm run build
      - name: Build site and admin dashboard
        env:
          VITE_ENABLE_FELLOWSHIP_API: 'true'
        run: npm run build
